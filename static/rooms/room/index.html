<div class="room-app" id="app" hidden>

    <a class="wordmark" href="/rooms/" title="Back to rooms"><span class="badge"><svg viewBox="0 0 645 554"><use href="#nh-mark"/></svg></span></a>
    <div class="titles"><h1 id="rTitle">Room</h1><div class="meta" id="rMeta"></div></div>
    <button class="btn btn-sm" id="copyBtn" type="button">Copy link</button>
    <button class="btn btn-sm" id="themeBtn" type="button">Theme</button>
  </header>
  <div class="room-body">
    <section class="room-main">
      <div class="stage" id="stage">
        <div class="grid" id="grid" data-n="1"></div>
        <div class="dock" id="dock">
          <button class="dbtn" id="micBtn" type="button" aria-pressed="false" title="Mute or unmute">

            <svg class="ic off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5 2M15 9V6a3 3 0 0 0-6 0M5 11a7 7 0 0 0 11 5.5M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></svg>
          </button>
          <button class="dbtn" id="camBtn" type="button" aria-pressed="false" title="Camera on or off">
            <svg class="ic on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10l6-3v10l-6-3"/></svg>
            <svg class="ic off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M7 6h5a3 3 0 0 1 3 3v3M15 15v0a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9M15 10l6-3v10l-3-1.5"/></svg>
          </button>
          <button class="dbtn" id="fsBtn" type="button" title="Fullscreen">

<div class="screen" id="screen"><div class="card"><h2 id="sTitle">Joining</h2><p id="sMsg">One moment.</p><div id="sActs" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"></div></div></div>

<script src="/rooms/common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const { api, esc } = NH;
  NH.themeToggle($('themeBtn'));

  const roomId = (new URLSearchParams(location.search).get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  let ws = null, room = null, me = null, myId = null, ended = false, joinedOnce = false;
  let screening = false, frameMs = 5000, frameTimer = null, pingTimer = null, retries = 0;
  let localStream = null, micOn = true, camOn = true, hasCam = false;
  let ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
  const members = new Map();   // id -> {id, username, role, mic, cam}
  const peers = new Map();     // id -> {pc, stream, queue, ready}
  const requests = new Map();  // id -> username
  let reporting = null;

  function screen(title, msg, acts) {
    $('app').hidden = true; $('screen').hidden = false;
    $('sTitle').textContent = title; $('sMsg').textContent = msg;
    $('sActs').innerHTML = '';
    (acts || [{ label: 'Back to rooms', href: '/rooms/' }]).forEach((a) => {
      const el = document.createElement('a'); el.className = 'btn ' + (a.primary ? 'btn-primary' : ''); el.textContent = a.label; el.href = a.href || '#';
      if (a.click) el.addEventListener('click', (e) => { e.preventDefault(); a.click(); });
      $('sActs').appendChild(el);
    });
  }
  function end(title, msg, acts) {
    ended = true; cleanup(); screen(title, msg, acts);
  }
  function showApp() { $('screen').hidden = true; $('app').hidden = false; }

  /* ---------- chat + people UI ---------- */
  function logLine(html, cls) {
    const d = document.createElement('div'); d.className = cls || 'm'; d.innerHTML = html;
    const log = $('log'); const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.appendChild(d); while (log.children.length > 200) log.removeChild(log.firstChild);
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function renderPeople() {
    const isOwner = me && room && me.role === 'owner';
    const list = [me].concat([...members.values()]).filter(Boolean);
    $('pCount').textContent = list.length;
    $('people').innerHTML = list.map((m) => {
      const self = m.id === myId;
      let h = '<div class="person"><span class="name">' + esc(m.username) + (self ? ' (you)' : '') + '</span>' +
        (m.role === 'owner' ? '<span class="role">OWNER</span>' : '');
      if (!self) {
        h += '<button class="btn btn-sm" data-act="report" data-id="' + m.id + '">Report</button>';
        if (isOwner) h += '<button class="btn btn-sm" data-act="kick" data-id="' + m.id + '">Remove</button><button class="btn btn-sm btn-danger" data-act="ban" data-id="' + m.id + '">Ban</button>';
      }
      h += '</div>';
      if (reporting === m.id) h += '<div class="reportbox"><input type="text" maxlength="120" placeholder="What happened?" data-rin="' + m.id + '"><button class="btn btn-sm btn-primary" data-act="sendreport" data-id="' + m.id + '">Send</button></div>';
      return h;
    }).join('');
    const rin = $('people').querySelector('[data-rin]'); if (rin) rin.focus();
  }
  function renderRequests() {
    const box = $('requests');
    box.innerHTML = [...requests].map(([id, name]) =>
      '<div class="person"><span class="name">' + esc(name) + ' wants to join</span>' +
      '<button class="btn btn-sm btn-primary" data-act="approve" data-id="' + id + '">Let in</button>' +
      '<button class="btn btn-sm" data-act="deny" data-id="' + id + '">Deny</button></div>').join('');
  }
  function renderRoom() {
    if (!room) return;
    document.title = room.title + ' | NearHi Room';
    $('rTitle').textContent = room.title;
    $('rMeta').textContent = 'Owner ' + room.owner + ' · ' + (room.mode === 'video' ? 'video + text' : 'text only') + (room.locked ? ' · locked' : '') + (room.policy === 'approval' ? ' · approval needed' : '');
    $('rules').textContent = room.rules || 'No rules set. Be decent.';
    document.body.classList.toggle('text-room', room.mode === 'text');
    if (me && me.role === 'owner') {
      $('ownerSec').hidden = false;
      $('lockBtn').textContent = room.locked ? 'Unlock room' : 'Lock room';
      $('policyBtn').textContent = room.policy === 'approval' ? 'Let anyone in' : 'Require approval';
    }
  }
  $('people').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === 'report') { reporting = reporting === id ? null : id; renderPeople(); }
    else if (act === 'sendreport') {
      const inp = $('people').querySelector('[data-rin]');
      send({ type: 'report', target: id, reason: inp ? inp.value : '' });
      reporting = null; renderPeople();
    } else if (act === 'kick' || act === 'ban') {
      const m = members.get(id);
      if (act === 'ban' && !confirm('Ban ' + (m ? m.username : 'this person') + ' from this room?')) return;
      send({ type: 'admin', action: act, target: id });
    }
  });
  $('requests').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    send({ type: 'admin', action: b.dataset.act, target: b.dataset.id });
    requests.delete(b.dataset.id); renderRequests();
  });
  $('lockBtn').onclick = () => send({ type: 'admin', action: room.locked ? 'unlock' : 'lock' });
  $('policyBtn').onclick = () => send({ type: 'admin', action: 'policy', value: room.policy === 'approval' ? 'open' : 'approval' });
  $('closeBtn').onclick = () => { if (confirm('Close this room for everyone?')) send({ type: 'admin', action: 'close' }); };
  $('chatForm').addEventListener('submit', (e) => {
    e.preventDefault(); const t = $('chatInput').value.trim(); if (!t) return;
    send({ type: 'chat', text: t }); $('chatInput').value = '';
  });
  $('copyBtn').onclick = async () => {
    const url = location.origin + '/rooms/room/?r=' + roomId;
    try { await navigator.clipboard.writeText(url); $('copyBtn').textContent = 'Copied'; }
    catch (e) { prompt('Copy this link', url); }
    setTimeout(() => { $('copyBtn').textContent = 'Copy link'; }, 1500);
  };
  $('leaveBtn').onclick = () => { ended = true; cleanup(); location.href = '/rooms/'; };

  /* ---------- video grid ---------- */
  function tileFor(id, name, local) {
    let t = $('grid').querySelector('[data-tile="' + id + '"]');
    if (t) return t;
    t = document.createElement('div'); t.className = 'tile novideo'; t.dataset.tile = id;
    t.innerHTML = '<video autoplay playsinline' + (local ? ' muted style="transform:scaleX(-1)"' : '') + '></video>' +
      '<div class="avatar">' + esc((name || '?').slice(0, 1).toUpperCase()) + '</div>' +
      '<div class="who">' + esc(name) + (local ? ' (you)' : '') + '</div><div class="mutedmark">Muted</div>';
    $('grid').appendChild(t); layoutGrid(); return t;
  }
  function removeTile(id) { const t = $('grid').querySelector('[data-tile="' + id + '"]'); if (t) t.remove(); layoutGrid(); }
  function layoutGrid() {
    const n = $('grid').children.length; $('grid').dataset.n = n >= 3 ? 'many' : n;
  }
  function setTileState(id, m) {
    const t = $('grid').querySelector('[data-tile="' + id + '"]'); if (!t) return;
    t.classList.toggle('cam-off', m.cam === false); t.classList.toggle('mic-off', m.mic === false);
  }

  /* ---------- WebRTC mesh ---------- */
  function makePeer(id) {
    const pc = new RTCPeerConnection({ iceServers: ICE });
    const p = { pc, queue: [], ready: false };
    peers.set(id, p);
    pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'signal', to: id, data: { candidate: e.candidate } }); };
    pc.ontrack = (e) => {
      const m = members.get(id); const t = tileFor(id, m ? m.username : '?', false);
      const v = t.querySelector('video');
      if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
      t.classList.remove('novideo');
    };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { try { pc.restartIce(); } catch (e) {} } };
    return p;
  }
  function addLocal(pc) { if (localStream) localStream.getTracks().forEach((tr) => pc.addTrack(tr, localStream)); }
  async function offerTo(id) {
    const p = makePeer(id);
    if (localStream) addLocal(p.pc);
    if (!localStream || !localStream.getAudioTracks().length) p.pc.addTransceiver('audio', { direction: 'recvonly' });
    if (!localStream || !localStream.getVideoTracks().length) p.pc.addTransceiver('video', { direction: 'recvonly' });
    const offer = await p.pc.createOffer(); await p.pc.setLocalDescription(offer);
    send({ type: 'signal', to: id, data: { sdp: p.pc.localDescription } });
  }
  async function onSignal(from, data) {
    if (room.mode !== 'video') return;
    let p = peers.get(from);
    try {
      if (data.sdp) {
        if (data.sdp.type === 'offer') {
          if (p) { try { p.pc.close(); } catch (e) {} }
          p = makePeer(from);
          await p.pc.setRemoteDescription(data.sdp); p.ready = true;
          addLocal(p.pc);
          const ans = await p.pc.createAnswer(); await p.pc.setLocalDescription(ans);
          send({ type: 'signal', to: from, data: { sdp: p.pc.localDescription } });
          for (const c of p.queue.splice(0)) { try { await p.pc.addIceCandidate(c); } catch (e) {} }
        } else if (p && data.sdp.type === 'answer') {
          await p.pc.setRemoteDescription(data.sdp); p.ready = true;
          for (const c of p.queue.splice(0)) { try { await p.pc.addIceCandidate(c); } catch (e) {} }
        }
      } else if (data.candidate) {
        if (!p) { p = makePeer(from); }
        if (p.ready) { try { await p.pc.addIceCandidate(data.candidate); } catch (e) {} } else p.queue.push(data.candidate);
      }
    } catch (e) { /* a broken peer is replaced when they rejoin */ }
  }
  function dropPeer(id) {
    const p = peers.get(id); if (p) { try { p.pc.close(); } catch (e) {} peers.delete(id); }
    removeTile(id);
  }

  async function getMedia() {
    if (room.mode !== 'video') return;
    try { localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: true }); }
    catch (e) {
      try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); logLine('Camera not available, joined with audio only.', 'sys'); }
      catch (e2) { localStream = null; logLine('No camera or microphone, you can still watch and chat.', 'sys'); }
    }
    hasCam = !!(localStream && localStream.getVideoTracks().length);
    $('camBtn').disabled = !hasCam; $('micBtn').disabled = !(localStream && localStream.getAudioTracks().length);
    const t = tileFor(myId, me.username, true);
    if (localStream) { t.querySelector('video').srcObject = localStream; if (hasCam) t.classList.remove('novideo'); }
  }
  function pushState() {
    if (localStream) {
      localStream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
      localStream.getVideoTracks().forEach((t) => { t.enabled = camOn; });
    }
    $('micBtn').setAttribute('aria-pressed', String(!micOn)); $('camBtn').setAttribute('aria-pressed', String(!camOn));
    setTileState(myId, { mic: micOn, cam: camOn || !hasCam ? camOn : false });
    send({ type: 'state', mic: micOn, cam: camOn && hasCam });
  }
  $('micBtn').onclick = () => { micOn = !micOn; pushState(); };
  $('camBtn').onclick = () => { camOn = !camOn; pushState(); };

  /* fullscreen with auto hide */
  const stage = $('stage'); let hideT = null;
  function wake() { stage.classList.remove('ui-hidden'); clearTimeout(hideT); if (inFs()) hideT = setTimeout(() => stage.classList.add('ui-hidden'), 3000); }
  function inFs() { return document.fullscreenElement === stage || stage.classList.contains('is-fs'); }
  $('fsBtn').onclick = async () => {
    if (inFs()) { if (document.fullscreenElement) await document.exitFullscreen(); stage.classList.remove('is-fs'); }
    else { try { await stage.requestFullscreen(); } catch (e) { stage.classList.add('is-fs'); } }
    wake();
  };
  document.addEventListener('fullscreenchange', wake);
  stage.addEventListener('mousemove', wake); stage.addEventListener('touchstart', wake, { passive: true });

  /* screening: rotate through the other people's video and send small stills */
  const fc = document.createElement('canvas');
  function startFrames() {
    clearInterval(frameTimer);
    if (!screening || room.mode !== 'video') return;
    let idx = 0;
    const tick = () => {
      const ids = [...peers.keys()].filter((id) => { const v = $('grid').querySelector('[data-tile="' + id + '"] video'); const m = members.get(id); return v && v.videoWidth > 0 && !(m && m.cam === false); });
      if (!ids.length) return;
      const id = ids[idx++ % ids.length];
      const v = $('grid').querySelector('[data-tile="' + id + '"] video');
      const w = 320, h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
      fc.width = w; fc.height = h; fc.getContext('2d').drawImage(v, 0, 0, w, h);
      send({ type: 'frame', of: id, data: fc.toDataURL('image/jpeg', 0.6) });
    };
    frameTimer = setInterval(tick, Math.max(1500, frameMs / Math.max(1, peers.size)));
  }

  /* ---------- socket ---------- */
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function cleanup() {
    clearInterval(frameTimer); clearInterval(pingTimer);
    peers.forEach((p) => { try { p.pc.close(); } catch (e) {} }); peers.clear();
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
  }
  function resetGrid() { $('grid').innerHTML = ''; members.clear(); peers.forEach((p) => { try { p.pc.close(); } catch (e) {} }); peers.clear(); }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/api/rooms/ws?r=' + encodeURIComponent(roomId));
    ws.onopen = () => { clearInterval(pingTimer); pingTimer = setInterval(() => send({ type: 'ping' }), 25000); };
    ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handle(m); };
    ws.onclose = () => {
      clearInterval(frameTimer); clearInterval(pingTimer);
      if (ended) return;
      if (retries < 4) { retries++; screen('Reconnecting', 'Connection dropped, trying again.', [{ label: 'Leave', href: '/rooms/' }]); setTimeout(connect, 1200 * retries); }
      else end('Disconnected', 'Could not reach the room.', [{ label: 'Try again', primary: true, click: () => location.reload() }, { label: 'Back to rooms', href: '/rooms/' }]);
    };
  }

  async function handle(m) {
    switch (m.type) {
      case 'pending':
        room = m.room; screen('Waiting for the owner', 'The owner of "' + room.title + '" approves each person. Keep this tab open.', [{ label: 'Cancel', href: '/rooms/' }]); break;
      case 'joined': {
        retries = 0; room = m.room; screening = !!m.video_screening; frameMs = m.frame_interval_ms || 5000;
        resetGrid(); $('log').innerHTML = '';
        me = m.you; myId = me.id; m.members.forEach((x) => members.set(x.id, x));
        showApp(); renderRoom();
        if (!joinedOnce) { joinedOnce = true; }
        await getMedia();
        pushState();
        for (const x of m.members) { tileFor(x.id, x.username, false); setTileState(x.id, x); }
        renderPeople(); renderRequests();
        if (room.mode === 'video') for (const x of m.members) { try { await offerTo(x.id); } catch (e) {} }
        startFrames();
        logLine('You joined ' + esc(room.title) + '.', 'sys');
        break;
      }
      case 'member_joined':
        members.set(m.member.id, m.member); if (room.mode === 'video') tileFor(m.member.id, m.member.username, false);
        renderPeople(); logLine(esc(m.member.username) + ' joined.', 'sys'); break;
      case 'member_left': {
        const x = members.get(m.id); members.delete(m.id); dropPeer(m.id); renderPeople();
        if (x) logLine(esc(x.username) + (m.reason === 'kicked' ? ' was removed.' : ' left.'), 'sys'); break;
      }
      case 'member_state': { const x = members.get(m.id); if (x) { x.mic = m.mic; x.cam = m.cam; setTileState(m.id, x); } break; }
      case 'signal': onSignal(m.from, m.data); break;
      case 'chat': {
        const self = m.from === myId;
        logLine('<b>' + esc(m.username) + '</b> ' + esc(m.text), 'm' + (self ? ' me' : '')); break;
      }
      case 'chat_blocked': logLine('That message was blocked.', 'sys'); break;
      case 'report_ok': logLine('Report sent. Thank you.', 'sys'); break;
      case 'join_request': requests.set(m.id, m.username); renderRequests(); break;
      case 'request_withdrawn': requests.delete(m.id); renderRequests(); break;
      case 'room_update': room = m.room; renderRoom(); break;
      case 'room_closed':
        end('Room closed', m.reason === 'closed_by_owner' ? 'The owner closed this room.' : 'The owner left, so the room closed.'); break;
      case 'kicked':
        end(m.ban ? 'You were banned' : 'You were removed', m.ban ? 'The owner banned you from this room.' : 'The owner removed you from this room. You can try joining again.'); break;
      case 'denied': end('Not let in', 'The owner did not approve your request.'); break;
      case 'video_blocked':
        end('Removed for your video', 'Our screening flagged your camera. Repeated flags lead to a ban from rooms.'); break;
      case 'error': {
        const map = {
          auth: ['Sign in first', 'You need an account to join rooms.', [{ label: 'Sign in', primary: true, href: '/rooms/?next=' + encodeURIComponent(location.pathname + location.search) }]],
          banned: ['Not allowed', 'This account can not use rooms.'],
          no_room: ['Room not found', 'It was closed or never existed.'],
          room_banned: ['You are banned', 'The owner banned you from this room.'],
          room_locked: ['Room is locked', 'The owner is not letting anyone new in right now.'],
          room_full: ['Room is full', 'Try again in a moment or pick another room.'],
        };
        if (m.code === 'room_full' && me && me.role === 'owner') { logLine('Room is full, can not let more people in.', 'sys'); break; }
        const e = map[m.code]; if (e) end(e[0], e[1], e[2]); break;
      }
    }
  }

  /* ---------- boot ---------- */
  (async function boot() {
    if (!roomId) { screen('No room', 'This link has no room code.'); return; }
    const acct = await NH.me();
    if (!acct || acct.needs_profile) { location.replace('/rooms/?next=' + encodeURIComponent(location.pathname + location.search)); return; }
    try { room = (await api('GET', '/api/rooms/' + roomId)).room; }
    catch (e) { screen('Room not found', 'It was closed or never existed.'); return; }
    screen(room.title, 'Joining...');
    try { const s = await (await fetch('/ice-servers')).json(); if (Array.isArray(s) && s.length) ICE = s; } catch (e) {}
    window.addEventListener('beforeunload', () => { try { ws && ws.close(); } catch (e) {} });
    connect();
  })();
})();
</script>
</body>
</html>
